# TecGate — https://github.com/amslertec/tecgate
#
# Copy .env.example to .env, fill in the four values, then:
#
#     mkdir -p data && sudo chown -R 1000:1000 data
#     docker compose up -d
#
# The container runs as uid 1000, which is why the data directory has to
# belong to it. Details and troubleshooting are in the README.

services:
  # The main service: web interface, Traefik, certificates, WAF.
  tecgated:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: tecgated
    restart: unless-stopped
    # 40 s before SIGKILL (audit D-06): Traefik's graceTimeOut is 30 s, and
    # the flushes of WAF counters, bundles and metrics run after it.
    # Docker's default of 10 s cut them off.
    stop_grace_period: 40s
    depends_on:
      - dockerguard
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 - used once "Offer HTTP/3" is switched on
      - "8090:8090"   # web interface
      - "8091:8091"   # same, over TLS
    volumes:
      - ./data:/data
      # Where backups are written. This line is the ONLY place the target
      # is set - the interface has no field for it, and deliberately so:
      # the container sees exactly the mounts listed here, and a text
      # field would accept a path that does not exist inside it.
      #
      # Put whatever you want on the left. A path on a SECOND disk or an
      # NFS mount is the sensible choice - a backup next to the original
      # helps against a wrong click, not against a failing disk.
      #
      # Remove the line and TecGate writes to ./data/sicherungen instead
      # and says so in the interface. It backs up either way.
      - ./backups:/backup
      - guardsocket:/guard
      - contenttargets:/contenttargets
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is missing - see .env.example}
      LOKALE_DOCKER_ADRESSE: ${LAN_ADDRESS:?LAN_ADDRESS is missing - see .env.example}
      ZERT_NAMEN: ${CERT_NAMES:?CERT_NAMES is missing - see .env.example}
      DOCKER_SOCKET: /guard/docker.sock
      INHALT_ZIEL_VERZEICHNIS: /contenttargets
      INHALT_ZAEHLER_QUELLE: http://contentguard:8096/zaehler
      INHALT_TREFFER_QUELLE: http://contentguard:8096/treffer
      LOG_STUFE: INFO
      GOMEMLIMIT: 450MiB
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    # No capabilities; NET_BIND_SERVICE is not needed for 80/443 because
    # unprivileged ports start at 80 in this container (sysctls below).
    # Under no-new-privileges a file capability on the binary would be
    # ignored, so this sysctl is the mechanism that lets uid 1000 bind them.
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Reads the Docker socket so the interface can list your containers.
  # It passes exactly two read-only routes through and discards the rest,
  # so that a mounted socket does not mean "root on the host".
  dockerguard:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: dockerguard
    entrypoint: ["/usr/local/bin/dockerguard"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - guardsocket:/guard
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      WACHT_SOCKET: /guard/docker.sock
      LOG_STUFE: INFO
    # The socket belongs to a group whose number differs per host.
    # Without it the container page stays empty.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is missing - run: getent group docker | cut -d: -f3}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image's healthcheck detects its role via /proc/1/comm and, for
    # the guard, checks that its Unix socket is bound (gesundheit.sh).
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Coraza with the OWASP Core Rule Set. Only used by hosts where you
  # switch content inspection on; it listens on no published port.
  contentguard:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: contentguard
    entrypoint: ["/usr/local/bin/contentguard"]
    restart: unless-stopped
    read_only: true
    volumes:
      - contenttargets:/contenttargets:ro
    environment:
      INHALT_ZIELTABELLE: /contenttargets/zieltabelle.json
      INHALT_ADRESSE: ":8095"
      INHALT_ZAEHLER_ADRESSE: ":8096"
      LOG_STUFE: INFO
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Same healthcheck as the guard above. For contentguard it asks the
    # counter endpoint on 8096, not the forwarder on 8095 - a request
    # there would reach a backend and fail whenever a host is misconfigured.
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  guardsocket:
  contenttargets:
