# TecGate — https://github.com/amslertec/tecgate
#
# Copy .env.example to .env, fill in the four values, then:
#
#     mkdir -p data && sudo chown -R 1000:1000 data
#     docker compose up -d
#
# The container runs as uid 1000, which is why the data directory has to
# belong to it. Details and troubleshooting are in the README.

services:
  # The main service: web interface, Traefik, certificates, WAF.
  tecgated:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: tecgated
    restart: unless-stopped
    depends_on:
      - dockerwacht
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"   # web interface
      - "8091:8091"   # same, over TLS
    volumes:
      - ./data:/data
      - wachtsocket:/wacht
      - inhaltsziele:/inhaltsziele
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is missing - see .env.example}
      LOKALE_DOCKER_ADRESSE: ${LAN_ADDRESS:?LAN_ADDRESS is missing - see .env.example}
      ZERT_NAMEN: ${CERT_NAMES:?CERT_NAMES is missing - see .env.example}
      DOCKER_SOCKET: /wacht/docker.sock
      INHALT_ZIEL_VERZEICHNIS: /inhaltsziele
      INHALT_ZAEHLER_QUELLE: http://inhaltswache:8096/zaehler
      INHALT_TREFFER_QUELLE: http://inhaltswache:8096/treffer
      LOG_STUFE: INFO
      GOMEMLIMIT: 450MiB
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Reads the Docker socket so the interface can list your containers.
  # It passes exactly two read-only routes through and discards the rest,
  # so that a mounted socket does not mean "root on the host".
  dockerwacht:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: dockerwacht
    entrypoint: ["/usr/local/bin/dockerwacht"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wachtsocket:/wacht
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      WACHT_SOCKET: /wacht/docker.sock
      LOG_STUFE: INFO
    # The socket belongs to a group whose number differs per host.
    # Without it the container page stays empty.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is missing - run: getent group docker | cut -d: -f3}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Coraza with the OWASP Core Rule Set. Only used by hosts where you
  # switch content inspection on; it listens on no published port.
  inhaltswache:
    image: amslertec/tecgate:${TECGATE_VERSION:-latest}
    container_name: inhaltswache
    entrypoint: ["/usr/local/bin/inhaltswache"]
    restart: unless-stopped
    read_only: true
    volumes:
      - inhaltsziele:/inhaltsziele:ro
    environment:
      INHALT_ZIELTABELLE: /inhaltsziele/zieltabelle.json
      INHALT_ADRESSE: ":8095"
      INHALT_ZAEHLER_ADRESSE: ":8096"
      LOG_STUFE: INFO
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wachtsocket:
  inhaltsziele:
